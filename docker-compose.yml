version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supermart-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://supermart:supermart@postgres:5432/supermart?schema=public
      - JWT_SECRET=super_secret_jwt_key_local
      - JWT_REFRESH_SECRET=super_secret_refresh_key_local
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_EXPIRES_IN=30d
      - ALLOWED_ORIGINS=http://localhost:3000
      - OTP_EXPIRY_MINUTES=10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    # Run migrations before starting
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm start"

  postgres:
    image: postgres:15-alpine
    container_name: supermart-postgres
    environment:
      - POSTGRES_USER=supermart
      - POSTGRES_PASSWORD=supermart
      - POSTGRES_DB=supermart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermart -d supermart"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
